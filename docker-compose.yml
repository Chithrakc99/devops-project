

services:

  mongodb:
    image: mongo:7-jammy
    container_name: legal_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - legal-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: legal_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/devops_legal
      - JWT_SECRET=supersecretdevopskey_change_in_production
      - PORT=5000
      - NODE_ENV=production
    networks:
      - legal-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: legal_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - legal-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - legal-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - legal-network

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - legal-network

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
  sonarqube_data:
  sonarqube_logs:

networks:
  legal-network:
    driver: bridge