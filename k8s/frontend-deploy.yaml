---
# ── Frontend Deployment ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-frontend
  labels:
    app: legal-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legal-frontend
  template:
    metadata:
      labels:
        app: legal-frontend
    spec:
      containers:
        - name: legal-frontend
          # TODO: Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username
          image: YOUR_DOCKERHUB_USERNAME/legal-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20

---
# ── Frontend Service ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: legal-frontend
  ports:
    - port: 80
      targetPort: 80
