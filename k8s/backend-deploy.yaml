---
# ── Backend ConfigMap ──────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://mongo:27017/devops_legal"

---
# ── Backend Secret (base64 encoded values) ────────────────────────────
# To generate: echo -n 'your_secret' | base64
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
data:
  # Default: "supersecretdevopskey_change_in_production" base64 encoded
  JWT_SECRET: c3VwZXJzZWNyZXRkZXZvcHNrZXlfY2hhbmdlX2luX3Byb2R1Y3Rpb24=

---
# ── Backend Deployment ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-backend
  labels:
    app: legal-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legal-backend
  template:
    metadata:
      labels:
        app: legal-backend
    spec:
      containers:
        - name: legal-backend
          # TODO: Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username
          image: YOUR_DOCKERHUB_USERNAME/legal-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

---
# ── Backend Service ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: LoadBalancer
  selector:
    app: legal-backend
  ports:
    - port: 5000
      targetPort: 5000
